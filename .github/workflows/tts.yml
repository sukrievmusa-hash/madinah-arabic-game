name: Записать звук слов

on:
  push:
    branches: [main]
    paths: ['audio/words.tsv', '.github/scripts/tts.py', '.github/workflows/tts.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tts
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts==7.0.2
      - run: python .github/scripts/tts.py
      - name: Сохранить звук в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add audio/*.mp3
          git diff --cached --quiet && echo "нет новых файлов" && exit 0
          git commit -m "Звук слов: $(ls audio/*.mp3 | wc -l) файлов"
          git pull --rebase origin main
          git push
